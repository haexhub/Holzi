# Hermes — lokaler Dev-Stack
#
# Eigenständiges Compose-File (NICHT als Override auf docker-compose.yml gedacht).
# Bringt Backend + LLM-Proxy + Signal hinter einem lokalen Traefik hoch und
# routet alle Services über `*.localhost`. Frontend (Nuxt dev mit HMR) kommt
# über das `frontend`-Profil dazu.
#
# Voraussetzungen:
#   - `.env` ausgefüllt (mindestens HERMES_AUTH_TOKEN — `make token` generiert,
#     und HERMES_SECRET_KEY = 64-hex-AES-Key, identisch in Hermes und Proxy)
#   - `haex-claude-proxy:dev` lokal gebaut (separates Repo unter ~/Projekte/haex-claude-proxy)
#     — oder HAEX_CLAUDE_PROXY_TAG in der .env auf einen anderen vorhandenen Tag
#   - haex-claude-proxy-resolver-sqlite als Schwester-Verzeichnis unter
#     ../haex-claude-proxy-resolver-sqlite (mit installierten node_modules) —
#     wird ins Proxy-image bind-gemounted, damit PROXY_RESOLVER es findet.
#     Setup: `cd ../haex-claude-proxy-resolver-sqlite && npm install`
#   - Fürs `frontend`-Profil: holzi-frontend als Schwester-Verzeichnis unter
#     ../holzi-frontend ausgecheckt
#
# Routing (alle HTTP, kein TLS):
#   http://hermes.localhost          → hermes-server:8082    (REST API direkt)
#   http://app.localhost             → holzi-frontend:3001   (UI, nur mit --profile frontend)
#   http://app.localhost/api/*       → hermes-server:8082    (gleicher Origin wie UI, kein CORS, kein devProxy)
#   http://localhost:11000           → Traefik-Dashboard
#
# `*.localhost` löst in modernen Browsern automatisch auf 127.0.0.1 (RFC 6761) —
# kein /etc/hosts-Eintrag nötig.
#
# Port-Konflikte: Wenn auf dem Host bereits etwas auf :80 lauscht (system-Traefik,
# nginx, …), setze HERMES_LOCAL_WEB_PORT=11080 in der .env — dann sind die URLs
# z.B. http://hermes.localhost:11080 statt http://hermes.localhost. Genauso für
# das Dashboard via HERMES_LOCAL_DASHBOARD_PORT (default 11000).
#
# Start:
#   make up-local                              # backend-stack only
#   make up-local-full                         # +frontend
#   docker compose -f docker-compose.local.yml up
#   docker compose -f docker-compose.local.yml --profile frontend up

# Sandbox runtime (Plan 11b-a): this stack is now meant to run under
# `podman compose` (rootless). The agent spawns sandbox containers via the
# rootless Podman control socket — no Docker daemon socket, no DinD. Sandboxes
# run with NO network (HERMES_SANDBOX_NETWORK=none): the agent drives them over
# the control socket (exec), not the network, so a sandbox provably cannot
# reach the agent's DB, secrets, or other sandboxes. (Separate Podman networks
# are NOT isolated from each other by default — verified — so an "own network"
# would not be enough.) Controlled egress for git/builds is a deliberate later
# addition (Plans 13/16), not part of 11b-a.
#
# Tradeoff, stated honestly: mounting the Podman control socket into the agent
# is agent->host container-control authority — anyone who reaches it can create
# containers or attach one to hermes-local. Rootless Podman bounds the blast
# radius to the unprivileged host user (no root daemon, unlike the Docker
# socket), which is the v1 accepted posture; tightening this (socket proxy /
# scoped API) is a hardening follow-up.
networks:
  hermes-local:
    name: hermes-local
    driver: bridge

services:
  hermes-server:
    image: hermes-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HERMES_DB_PATH: /data/hermes.db
      HERMES_LLM_URL: ${HERMES_LLM_URL:-http://haex-claude-proxy:8080}
      HERMES_SIGNAL_URL: ${HERMES_SIGNAL_URL:-http://signal-cli-rest-api:8080}
      # AES-Master-Key für llm_credentials-Ciphertext. MUSS identisch zu
      # dem sein, was die haex-claude-proxy SQLite-Resolver-Instanz liest
      # — sonst schlägt die Decryption beim Forwarding fehl.
      HERMES_SECRET_KEY: ${HERMES_SECRET_KEY}
      # Sandbox runtime: rootless Podman control socket; sandboxes get no
      # network (none) — isolation by absence of networking, see header.
      HERMES_SANDBOX_SOCKET: ${HERMES_SANDBOX_SOCKET:-unix:///run/podman/podman.sock}
      HERMES_SANDBOX_NETWORK: ${HERMES_SANDBOX_NETWORK:-none}
      HERMES_SANDBOX_IMAGE: ${HERMES_SANDBOX_IMAGE:-hermes-sandbox:dev}
    volumes:
      - hermes-data:/data
      # Rootless Podman socket. Host path resolves to
      # $XDG_RUNTIME_DIR/podman/podman.sock under `podman compose`. The agent
      # uses it to create/exec/stop sandbox siblings.
      - ${HERMES_PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}:/run/podman/podman.sock
    networks:
      - hermes-local
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hermes-local"
      # Direkter API-Zugriff für CLI/curl/Postman.
      - "traefik.http.routers.hermes.entrypoints=web"
      - "traefik.http.routers.hermes.rule=Host(`hermes.localhost`)"
      - "traefik.http.services.hermes.loadbalancer.server.port=8082"
      # Zweiter Router auf demselben Service: leitet /api/* vom Frontend-Host
      # ans Backend — gleicher Origin, kein CORS, kein Nuxt-devProxy nötig.
      - "traefik.http.routers.hermes-api.entrypoints=web"
      - "traefik.http.routers.hermes-api.rule=Host(`app.localhost`) && PathPrefix(`/api`)"
      # Höhere Priority als der Frontend-Catch-All auf app.localhost
      # (default auto-priority = rule length, ~21). Sonst schluckt das
      # Frontend die /api/*-Requests und der Nuxt-devProxy hängt sich.
      - "traefik.http.routers.hermes-api.priority=100"
      - "traefik.http.routers.hermes-api.service=hermes"
    depends_on:
      - haex-claude-proxy
      - signal-cli-rest-api

  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-cli-rest-api
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli
    networks:
      - hermes-local

  haex-claude-proxy:
    # Image-Tag konfigurierbar — Default `dev` matched das, was im
    # haex-claude-proxy-Repo via `make build` rauskommt. Prod-Deployments
    # setzen HAEX_CLAUDE_PROXY_TAG auf einen gepinnten SHA.
    image: haex-claude-proxy:${HAEX_CLAUDE_PROXY_TAG:-dev}
    container_name: haex-claude-proxy
    restart: unless-stopped
    environment:
      # SQLite-Resolver liest die aktive llm_credentials-Zeile aus Hermes's
      # DB (geteiltes hermes-data-Volume) und entschlüsselt mit dem geteilten
      # HERMES_SECRET_KEY. Kein Host-`~/.claude` mehr nötig.
      PROXY_RESOLVER: haex-claude-proxy-resolver-sqlite
      HERMES_DB_PATH: /data/hermes.db
      HERMES_SECRET_KEY: ${HERMES_SECRET_KEY}
      CREDENTIALS_ROOT: /run/credentials
    volumes:
      # Shared DB volume — Hermes schreibt CRUD + OAuth-Authorize, Proxy
      # liest beim Resolve und schreibt nur den seltenen OAuth-Refresh
      # zurück (Stunden-Cadenz). SQLite WAL + 5s busy_timeout im Plugin
      # halten beide Writer kollisionsfrei.
      - hermes-data:/data
      # Plugin bind-mount: das Proxy-Image bringt nur die Builtin-Resolver
      # mit; PROXY_RESOLVER=haex-claude-proxy-resolver-sqlite triggert ein
      # dynamic import(), das wir hier in node_modules verfügbar machen.
      # Voraussetzung: `npm install` im resolver-sqlite-Checkout.
      - ../haex-claude-proxy-resolver-sqlite:/app/node_modules/haex-claude-proxy-resolver-sqlite:ro
    tmpfs:
      # Per-Spawn-HOMEs für die `claude` CLI landen hier — tmpfs verhindert
      # plaintext-Credentials auf disk, auch wenn das Plugin nach Spawn-Exit
      # selbst aufräumt.
      - /run/credentials:mode=700,uid=1000
    networks:
      - hermes-local

  holzi-frontend:
    profiles: ["frontend"]
    image: node:22-alpine
    container_name: holzi-frontend
    restart: unless-stopped
    working_dir: /app
    # pnpm via corepack — kein eigenes Dockerfile nötig, der Source liegt eh
    # als Bind-Mount unter /app. `pnpm dev --host 0.0.0.0` macht den Nuxt-Dev-
    # Server auch von außerhalb des Containers erreichbar (Traefik).
    # 1. pnpm-Version auf Host-Stand pinnen — corepack-Default ist sonst
    #    pnpm 11 mit strengerer Supply-Chain-Policy als das vom Host
    #    generierte Lockfile (pnpm 10).
    # 2. `--config.minimumReleaseAge=0` bypassed die "Package zu jung"-
    #    Policy für frische Lockfile-Einträge (kein Host-Cache im Container).
    command: ["sh", "-c", "corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile --config.minimumReleaseAge=0 && pnpm dev --host 0.0.0.0"]
    environment:
      HOST: 0.0.0.0
      # Pnpm 11 prompted bei deps-Drift interaktiv "modules purgen?" — ohne TTY
      # → exit 1. CI=true ist der dokumentierte Fallback.
      CI: "true"
    volumes:
      - ../holzi-frontend:/app
      # Anonymous volumes: verhindern, dass Host-node_modules / Nuxt-Caches die
      # Container-Versionen überschreiben (Alpine-Binaries vs. glibc-Host).
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    networks:
      - hermes-local
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hermes-local"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3001"
    depends_on:
      - hermes-server

  traefik:
    # `:v3` rolling-tag — `:v3.2` requested Docker-API 1.24, was bei modernen
    # Daemons (>= API 1.40) im "client version too old"-Error endet.
    image: traefik:v3
    container_name: hermes-traefik
    restart: unless-stopped
    environment:
      # Belt-and-suspenders: zwingt Traefik's docker client auf eine kompatible
      # API-Version, falls die Image-Default doch wieder zu alt sein sollte.
      DOCKER_API_VERSION: "1.43"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hermes-local
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      # Loopback-only — der Dev-Stack ist nicht für andere Hosts gedacht.
      # Wer's auf einer LAN-IP exposen will, kann das Prefix lokal entfernen.
      - "127.0.0.1:${HERMES_LOCAL_WEB_PORT:-80}:80"
      # Dashboard (zum Debuggen der Router/Middlewares) — `api.insecure=true`,
      # daher bewusst nicht auf 0.0.0.0 binden.
      - "127.0.0.1:${HERMES_LOCAL_DASHBOARD_PORT:-11000}:8080"
    volumes:
      # Rootless Podman socket mapped to Traefik's default docker endpoint, so
      # label discovery works unchanged under `podman compose`.
      - ${HERMES_PODMAN_SOCKET:-${XDG_RUNTIME_DIR}/podman/podman.sock}:/var/run/docker.sock:ro
    networks:
      - hermes-local

volumes:
  hermes-data:
  signal-data:
