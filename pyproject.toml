[project]
name = "hermes-server"
version = "0.0.1"
description = "Hermes — personal AI assistant backend (FastAPI, SQLite/FTS5, MCP, Signal worker)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marko Drechsel", email = "mdrechsel@itemis.com" }]

# Runtime deps are intentionally minimal in Phase 0.
# Subsequent phases add: fastapi, uvicorn, aiosqlite, anthropic, mcp, httpx, etc.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
