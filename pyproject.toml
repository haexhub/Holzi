[project]
name = "hermes-server"
version = "0.0.1"
description = "Hermes — personal AI assistant backend (FastAPI, SQLite/FTS5, MCP, Signal worker)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marko Drechsel", email = "mdrechsel@itemis.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "trafilatura>=1.12",
    "cryptography>=48.0.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-croniter>=2.0",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate emits create_index calls with sa.literal_column(...) that
# routinely exceed line length. Migrations are append-only history — don't
# reformat them to satisfy lint.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests (real Podman) are opt-in: there is no Podman daemon in CI.
# Run them explicitly with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires external services (e.g. a rootless Podman socket)",
    "real_persona_context: opt out of the autouse persona-context patch; test seeds its own credential",
]
